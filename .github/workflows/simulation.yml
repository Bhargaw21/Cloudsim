name: Run Auto-Scaling Simulation

on: [push]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'  # ✅ REQUIRED: e.g., temurin, zulu, adopt, etc.
          java-version: '11'       # ✅ Your required Java version

      - name: Build with Maven
        run: mvn clean install
        working-directory: cloudsim_autoscaler

      - name: Run Simulation
        run: mvn exec:java -Dexec.mainClass="org.autoscaler.AutoScalerSimulation"
        working-directory: cloudsim_autoscaler
